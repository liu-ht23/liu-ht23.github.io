# The following is the order of the links in the header of the website.
#
# Changing the order here will adjust the order and you can also add additional
# links. Removing a link prevents it from showing in the header, but does not
# prevent it from being included in the site.
#
# NOTE that only one of the CV options should be selected, the first is for the
#      Markdown formatted page while the second is generated using JSON.
#
# The Guide (template docs) and the JSON CV are commented out. To enable one later:
#   1. uncomment its two lines below;
#   2. remove "published: false" from its page in _pages/ (e.g. _pages/talks.html)
#      and from the example files in its folder (e.g. _talks/), or replace them with your own.

main:
  - title: "Publications"
    url: /publications/

  - title: "Talks"
    url: /talks/

  - title: "Teaching"
    url: /teaching/

  - title: "Portfolio"
    url: /portfolio/

  - title: "Blog Posts"
    url: /year-archive/

  - title: "CV"
    url: /cv/

