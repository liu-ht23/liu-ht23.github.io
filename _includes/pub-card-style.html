<style>
.pub { display: flex; gap: 22px; align-items: flex-start; padding: 18px 0; border-bottom: 1px solid rgba(127, 127, 127, 0.18); }
.pub-media { flex: 0 0 220px; }
.pub-media video, .pub-media img, .pub-ph {
  display: block; width: 220px; height: 138px; object-fit: cover; border-radius: 8px;
  background: rgba(127, 127, 127, 0.12); box-shadow: 0 1px 4px rgba(0, 0, 0, 0.15);
}
.pub-ph { display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.3em; opacity: 0.75; }
.pub-body { flex: 1; min-width: 0; line-height: 1.5; }
.pub-title { font-weight: 700; font-size: 1.02em; margin-bottom: 3px; }
.pub-title a { color: inherit; text-decoration: none; }
.pub-title a:hover { text-decoration: underline; }
.pub-authors { font-size: 0.92em; opacity: 0.9; }
.pub-venue { font-size: 0.92em; font-style: italic; margin-top: 2px; }
.pub-venue.accepted { font-style: normal; font-weight: 700; color: #b8520a; }
.pub-links { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.pub-links a {
  font-size: 0.8em; padding: 1px 10px; border: 1px solid currentColor; border-radius: 12px;
  text-decoration: none; opacity: 0.85;
}
.pub-links a:hover, .pub-links a[aria-expanded="true"] { opacity: 1; text-decoration: none; }
.pub-links a[aria-expanded="true"] { font-weight: 700; }
.pub-panel { margin-top: 10px; padding: 0.8em 1em; border-radius: 6px; font-size: 0.85em; line-height: 1.55;
  background: rgba(127, 127, 127, 0.08); border-left: 3px solid rgba(127, 127, 127, 0.35); }
.pub-panel[hidden] { display: none; }
.pub-panel pre.pub-bibtex { margin: 0; padding: 0; background: none; border: 0; font-size: 0.9em; line-height: 1.45; white-space: pre; overflow-x: auto; }
.pub-copy { float: right; margin-left: 12px; font-size: 0.9em; text-decoration: none; }
.pub-year { margin: 1.6em 0 0; padding-bottom: 4px; font-size: 1.15em; border-bottom: 1px solid rgba(127, 127, 127, 0.3); }
.pub-note { font-size: 0.8em; opacity: 0.75; margin-top: 10px; }
@media (max-width: 600px) {
  .pub { flex-direction: column; gap: 10px; }
  .pub-media { flex-basis: auto; width: 100%; }
  .pub-media video, .pub-media img, .pub-ph { width: 100%; height: auto; aspect-ratio: 16 / 10; }
}
</style>
<script>
/* Abstract / BibTeX toggles and BibTeX copy for publication cards: one open panel per card. */
if (!window.pubCardsWired) {
  window.pubCardsWired = true;
  document.addEventListener("click", function (e) {
    var toggle = e.target.closest(".pub-toggle");
    if (toggle) {
      e.preventDefault();
      var body = toggle.closest(".pub-body");
      var panel = body.querySelector('.pub-panel[data-panel="' + toggle.dataset.panel + '"]');
      var opening = panel.hidden;
      body.querySelectorAll(".pub-panel").forEach(function (p) { p.hidden = true; });
      body.querySelectorAll(".pub-toggle").forEach(function (b) { b.setAttribute("aria-expanded", "false"); });
      panel.hidden = !opening;
      toggle.setAttribute("aria-expanded", String(opening));
      return;
    }
    var copy = e.target.closest(".pub-copy");
    if (copy) {
      e.preventDefault();
      var text = copy.parentNode.querySelector("pre").textContent;
      navigator.clipboard.writeText(text).then(function () {
        copy.textContent = "Copied";
        setTimeout(function () { copy.textContent = "Copy"; }, 1500);
      }, function () {});
    }
  });
}
</script>
